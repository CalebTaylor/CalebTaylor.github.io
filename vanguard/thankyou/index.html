<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Ironwood Fighters</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>

:root {
    --forest: #071d16;
    --deep-green: #05140f;
    --gold: #c8a75d;
    --cream: #eee4cc;
    --muted: #9ba99d;
    --border: rgba(200,167,93,.25);
}

* {
    box-sizing:border-box;
}

body {

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            rgba(5,20,15,.94),
            rgba(5,20,15,.97)
        ),
        url("images/background.jpg");

    background-size:cover;
    background-position:center;

    color:var(--cream);

    font-family:"Inter", Arial, sans-serif;

}

.thank-you {

    width:min(90%, 650px);

    padding:50px 40px;

    text-align:center;

    background:rgba(7,29,22,.85);

    border:1px solid var(--gold);

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

}

.crest {

    width:70px;
    height:70px;

    margin:0 auto 25px;

    border:2px solid var(--gold);

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:"Cinzel", serif;

    font-size:2rem;

    color:var(--gold);

}

.eyebrow {

    color:var(--gold);

    font-size:.75rem;

    font-weight:700;

    letter-spacing:.15em;

    text-transform:uppercase;

}

h1 {

    margin:15px 0;

    font-family:"Cinzel", serif;

    font-size:clamp(2rem,5vw,3.2rem);

    color:var(--gold);

}

p {

    color:var(--muted);

    line-height:1.7;

    max-width:500px;

    margin:0 auto 30px;

}

.button {

    display:inline-block;

    padding:14px 28px;

    background:transparent;

    border:1px solid var(--gold);

    color:var(--cream);

    text-decoration:none;

    font-family:"Cinzel", serif;

    font-weight:700;

    letter-spacing:.08em;

    text-transform:uppercase;

    transition:.25s;

}

.button:hover {

    background:var(--gold);

    color:var(--forest);

}

.divider {

    width:100px;

    height:1px;

    background:var(--gold);

    margin:30px auto;

    opacity:.5;

}

</style>

</head>

<body>

<main class="thank-you">

    <div class="crest">
        ⚔
    </div>

    <div class="eyebrow">
        Message Received
    </div>

    <h1>
        Thank You For Reaching Out
    </h1>

    <div class="divider"></div>

    <p>
        Your message has been delivered to the Vancouver Vanguard.
        Our team will review your inquiry and respond as soon as possible.
    </p>

    <p>
        We appreciate your interest in supporting the team and helping
        us continue to grow our sport.
    </p>

    <a href="../index.html" class="button">
        Return To Home
    </a>

</main>

</body>
</html>
